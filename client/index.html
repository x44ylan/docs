<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
    <meta name="apple-mobile-web-app-title" content="Docs">
    <meta name="robots" content="noindex">
    <link rel="apple-touch-icon" href="./touch.png" sizes="180x180">
    <link id="icon-png" rel="icon" type="image/png" href="./icon.png" sizes="32x32">
    <link id="icon-svg" rel="icon" type="image/svg+xml" href="./icon-light.svg">
    <title>Docs</title>
    <script>
        (() => {
            let theme;
            try { theme = localStorage.getItem('theme'); } catch {}
            const dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.classList.toggle('dark', dark);
            document.getElementById('icon-svg').href = dark ? './icon-dark.svg' : './icon-light.svg';
            document.getElementById('icon-png').href = dark ? './icon-dark.png' : './icon.png';
        })();
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
</body>
</html>
